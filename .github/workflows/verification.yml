name: AWBMS verification

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: awbms-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap-lockfile:
    name: Bootstrap Cargo.lock once
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0

      - name: Commit resolved lockfile only when absent
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock is already tracked; bootstrap write is unnecessary."
            exit 0
          fi

          # `cargo generate-lockfile` resolves manifests only; this write-capable
          # job deliberately does not build, test, run build scripts, or execute
          # project binaries while holding a write token.
          cargo generate-lockfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(vg-03): commit verified Cargo.lock (#4)"
          git push origin "HEAD:${HEAD_REF}"

  vg03-vg04:
    name: VG-03 / VG-04 Rust + PostgreSQL verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_ci_password
      POSTGRES_DB: awbms
      ADMIN_DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/awbms
      AWBMS_TEST_DATABASE_URL: postgres://awbms_app_vg04:awbms_vg04_ci_password@127.0.0.1:5432/awbms

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: awbms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d awbms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.98.0
          rustc --version
          cargo --version

      - name: Resolve bootstrap lockfile
        run: cargo generate-lockfile

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Prepare least-privilege RLS fixture
        run: psql "$ADMIN_DATABASE_URL" -f tests/fixtures/vg04_rls.sql

      - name: Unit and PostgreSQL integration tests
        run: cargo test --workspace --all-targets
