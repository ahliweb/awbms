name: Freeze VG-01 legacy evidence

# Two trust boundaries (issue #7, P0.1):
#   generate: runs pinned third-party code (bun install, migrations, tools).
#             Read-only token. Produces an artifact + sha256 manifest + attestation.
#   publish:  holds the write token. Runs NO install/build/migration/repository
#             script. Verifies the artifact, replaces only
#             contracts/legacy/awcms/frozen/** and opens a pull request. Gated by
#             the vg01-publish GitHub Environment (manual approval).
# Procedure: docs/architecture/evidence/VG-01-publication-procedure.md

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vg01-freeze
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and verify VG-01 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_ci_password
      POSTGRES_DB: postgres
      ADMIN_DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/postgres
      TARGET_ADMIN_DATABASE_URL: postgres://postgres:postgres_ci_password@127.0.0.1:5432/awcms_vg01
      OWNER_DATABASE_URL: postgres://awcms_vg01_owner:awcms_vg01_owner_fixture_password@127.0.0.1:5432/awcms_vg01

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout AWBMS without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup override set 1.98.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Checkout pinned AWCMS source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ahliweb/awcms
          ref: 11f2e95a47b1328a820f976d60f978c38a067903
          path: .legacy/awcms
          persist-credentials: false

      - name: Checkout pinned AWCMS-Astro source without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ahliweb/awcms-astro
          ref: 7b753be619244541b817d5d8e7d3b72cfe88d4f9
          path: .legacy/awcms-astro
          persist-credentials: false

      - name: Install pinned AWCMS dependencies
        working-directory: .legacy/awcms
        run: bun install --frozen-lockfile

      - name: Regenerate and verify static evidence
        run: |
          rustc --edition 2024 -D warnings tools/vg01_inventory.rs -o /tmp/vg01
          /tmp/vg01 .legacy/awcms .legacy/awcms-astro /tmp/vg01-static-a
          /tmp/vg01 .legacy/awcms .legacy/awcms-astro /tmp/vg01-static-b
          diff -ru /tmp/vg01-static-a /tmp/vg01-static-b
          (
            cd /tmp/vg01-static-a
            find . -type f ! -name manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > manifest.sha256
            sha256sum -c manifest.sha256
          )

      - name: Regenerate and verify controlled live PostgreSQL evidence
        run: |
          bash tools/vg01_live_db.sh \
            .legacy/awcms \
            "$ADMIN_DATABASE_URL" \
            "$OWNER_DATABASE_URL" \
            "$TARGET_ADMIN_DATABASE_URL" \
            /tmp/vg01-live

      - name: Assemble frozen tree and digest manifest
        env:
          FREEZE_SOURCE_SHA: ${{ github.sha }}
          FREEZE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/vg01-artifact"
          rm -rf "$artifact"
          mkdir -p "$artifact/frozen/static" "$artifact/frozen/live"
          cp -a /tmp/vg01-static-a/. "$artifact/frozen/static/"
          cp -a /tmp/vg01-live/. "$artifact/frozen/live/"
          cat > "$artifact/frozen/provenance.json" <<JSON
          {
            "gate": "VG-01",
            "freezeSourceAwbmsCommit": "$FREEZE_SOURCE_SHA",
            "freezeWorkflowRunId": "$FREEZE_RUN_ID",
            "awcms": "11f2e95a47b1328a820f976d60f978c38a067903",
            "awcmsAstro": "7b753be619244541b817d5d8e7d3b72cfe88d4f9",
            "postgres": "18.6",
            "bun": "1.3.14",
            "rust": "1.98.0"
          }
          JSON

          # Verify the assembled tree with the repository verifier before upload.
          verify_root="$RUNNER_TEMP/vg01-verify-root"
          rm -rf "$verify_root"
          mkdir -p "$verify_root"
          cp -a "$artifact/frozen" "$verify_root/frozen"
          cp -a contracts/legacy/awcms/authorization "$verify_root/authorization"
          bash tools/vg01_verify_frozen.sh "$verify_root"

          # Digest manifest of the whole tree, kept outside the tree itself.
          (
            cd "$artifact"
            find frozen -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > frozen.sha256
            sha256sum -c frozen.sha256
          )

      - name: Upload evidence artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vg01-frozen-evidence
          path: ${{ runner.temp }}/vg01-artifact
          if-no-files-found: error
          retention-days: 14

      - name: Attest the digest manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/vg01-artifact/frozen.sha256

  publish:
    name: Publish VG-01 evidence pull request
    needs: generate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Named Environment with required reviewers = manual approval for the write path.
    environment: vg01-publish
    permissions:
      contents: write
      pull-requests: write

    # No dependency install, build, migration, or repository script runs here.
    steps:
      - name: Checkout AWBMS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Download evidence artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vg01-frozen-evidence
          path: ${{ runner.temp }}/vg01-artifact

      - name: Verify attestation and digest manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/vg01-artifact"
          gh attestation verify frozen.sha256 --repo "$GITHUB_REPOSITORY"
          sha256sum -c frozen.sha256
          if find frozen ! -type f ! -type d | grep -q .; then
            echo "Artifact contains non-regular entries" >&2
            exit 1
          fi
          # Every file present must be listed in the manifest, and vice versa.
          diff <(find frozen -type f | LC_ALL=C sort) \
               <(awk '{ sub(/^[^ ]+  /, ""); print }' frozen.sha256 | LC_ALL=C sort)

      - name: Replace frozen evidence and fail closed on other paths
        run: |
          set -euo pipefail
          prefix="contracts/legacy/awcms/frozen/"
          rm -rf "${prefix%/}"
          cp -a "$RUNNER_TEMP/vg01-artifact/frozen" "${prefix%/}"

          status="$(git status --porcelain --untracked-files=all)"
          if [[ -z "$status" ]]; then
            echo "Frozen corpus already matches regenerated evidence"
            echo "publish_needed=false" >> "$GITHUB_ENV"
            exit 0
          fi
          outside="$(printf '%s\n' "$status" | cut -c4- | { grep -vF "$prefix" || true; })"
          if [[ -n "$outside" ]]; then
            echo "Refusing change outside ${prefix}" >&2
            printf '%s\n' "$outside" >&2
            exit 1
          fi
          echo "publish_needed=true" >> "$GITHUB_ENV"

      - name: Commit to a new branch and open a pull request
        if: env.publish_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="ci/vg01-freeze-${RUN_ID}-${RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add contracts/legacy/awcms/frozen
          git commit -m "chore(vg-01): freeze legacy evidence corpus (#3)"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(vg-01): freeze legacy evidence corpus (#3)" \
            --body "Automated VG-01 evidence publication. Source commit ${SOURCE_SHA}, workflow run ${RUN_ID}. The digest manifest was attestation-verified and re-checked; only contracts/legacy/awcms/frozen/** changed. Review the diff before merging. Part of #3."
