# cargo-deny policy for the AWBMS workspace.
# Run by CI (`cargo deny --locked check`). Policy and exception rules:
# docs/security/supply-chain.md. Every exception added to this file needs an
# owner, rationale, expiry and compensating control recorded in that document.

[graph]
all-features = true

[advisories]
# RustSec advisory database (rustsec/advisory-db), fetched by cargo-deny.
version = 2
yanked = "deny"
# `ignore = []` is intentional. To add an exception use
#   { id = "RUSTSEC-YYYY-NNNN", reason = "owner=...; expires=YYYY-MM-DD; control=..." }
ignore = []

[licenses]
version = 2
# Allow-list derived from the actual dependency graph (`cargo deny list`) on
# 2026-11-23. Dual-licensed crates only need one acceptable alternative, so
# copyleft alternatives (e.g. LGPL-2.1-or-later on r-efi) are deliberately not
# allowed. The workspace crate itself is MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
